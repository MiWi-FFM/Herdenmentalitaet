<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andalusien 2026 – Reiseplan</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .sh-gate {
    max-width: 420px;
    margin: 6vh auto 0;
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 2.5rem 2rem;
    text-align: center;
  }
  .sh-gate img {
    width: 90px; height: 90px; border-radius: 50%;
    border: 3px solid rgba(102,126,234,0.35);
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    margin-bottom: 1.25rem;
  }
  .sh-gate h1 { font-size: 1.35rem; color: #333; margin-bottom: 0.4rem; }
  .sh-gate .sh-sub { color: #777; font-size: 0.95rem; margin-bottom: 1.75rem; }
  .sh-field { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  .sh-field input {
    flex: 1; padding: 0.8rem 0.9rem; font-size: 1rem;
    border: 1px solid #d5d8e0; border-radius: 8px; font-family: inherit;
  }
  .sh-field input:focus { outline: 2px solid #667eea; outline-offset: -1px; border-color: transparent; }
  .sh-field button {
    padding: 0.8rem 1.3rem; font-size: 1rem; font-weight: 600; font-family: inherit;
    color: white; background: #667eea; border: none; border-radius: 8px; cursor: pointer;
  }
  .sh-field button:hover { background: #5a6fd8; }
  .sh-field button:disabled { background: #b3bbe8; cursor: default; }
  .sh-msg { min-height: 1.4rem; font-size: 0.9rem; color: #c0392b; }
  .sh-msg.sh-busy { color: #777; }
  .sh-gatelangs { margin-top: 1.5rem; display: flex; gap: 0.4rem; justify-content: center; }
  .sh-topbar {
    max-width: 1000px; margin: 0 auto 1rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
  }
  .sh-back {
    color: rgba(255,255,255,0.92); text-decoration: none; font-size: 0.95rem; font-weight: 500;
    padding: 0.45rem 0.9rem; border-radius: 20px; background: rgba(255,255,255,0.15);
  }
  .sh-back:hover { background: rgba(255,255,255,0.28); }
  .sh-langs { display: flex; gap: 0.4rem; }
  .sh-lang {
    padding: 0.45rem 0.85rem; font-size: 0.9rem; font-weight: 600; font-family: inherit;
    border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.12);
    color: white; border-radius: 20px; cursor: pointer;
  }
  .sh-lang:hover { background: rgba(255,255,255,0.28); }
  .sh-lang.is-active { background: white; color: #667eea; border-color: white; }
  .sh-gatelangs .sh-lang {
    border-color: #d5d8e0; background: #f4f5f9; color: #667eea;
  }
  .sh-gatelangs .sh-lang.is-active { background: #667eea; color: white; border-color: #667eea; }
  [hidden] { display: none !important; }
</style>
</head>

<script>
(function () {
  var BUNDLE = JSON.parse(document.getElementById('bundle').textContent);
  var UI = {
    de: { title: 'Andalusien 2026', sub: 'Der Reiseplan ist passwortgeschützt.', ph: 'Passwort',
          btn: 'Öffnen', busy: 'Wird entschlüsselt …', bad: 'Falsches Passwort.',
          err: 'Die Seite konnte nicht geladen werden.', back: '← Übersicht',
          nocrypto: 'Dieser Browser unterstützt die nötige Verschlüsselung nicht. Bitte einen aktuellen Browser über HTTPS verwenden.' },
    es: { title: 'Andalucía 2026', sub: 'El plan de viaje está protegido con contraseña.', ph: 'Contraseña',
          btn: 'Abrir', busy: 'Descifrando …', bad: 'Contraseña incorrecta.',
          err: 'No se ha podido cargar la página.', back: '← Inicio',
          nocrypto: 'Este navegador no admite el cifrado necesario. Usa un navegador actual mediante HTTPS.' },
    pl: { title: 'Andaluzja 2026', sub: 'Plan podróży jest chroniony hasłem.', ph: 'Hasło',
          btn: 'Otwórz', busy: 'Odszyfrowywanie …', bad: 'Nieprawidłowe hasło.',
          err: 'Nie udało się wczytać strony.', back: '← Przegląd',
          nocrypto: 'Ta przeglądarka nie obsługuje wymaganego szyfrowania. Użyj aktualnej przeglądarki przez HTTPS.' }
  };

  var lang = 'de';
  var data = null;
  var gate = document.getElementById('gate');
  var topbar = document.getElementById('topbar');
  var planEl = document.getElementById('plan');
  var msg = document.getElementById('gate-msg');
  var pw = document.getElementById('gate-pw');
  var btn = document.getElementById('gate-btn');

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function applyUi() {
    var t = UI[lang];
    document.documentElement.lang = lang;
    document.getElementById('gate-title').textContent = t.title;
    document.getElementById('gate-sub').textContent = t.sub;
    pw.placeholder = t.ph;
    pw.setAttribute('aria-label', t.ph);
    btn.textContent = t.btn;
    document.getElementById('back-link').textContent = t.back;
    document.title = t.title + ' – ' + (lang === 'de' ? 'Reiseplan' : lang === 'es' ? 'Plan de viaje' : 'Plan podróży');
    Array.prototype.forEach.call(document.querySelectorAll('.sh-lang'), function (b) {
      b.classList.toggle('is-active', b.dataset.lang === lang);
    });
  }

  function applyPlanLang() {
    if (!data) return;
    var dict = data.i18n[lang] || {};
    var fallback = data.i18n.de;
    Array.prototype.forEach.call(planEl.querySelectorAll('[data-i18n]'), function (el) {
      var k = el.getAttribute('data-i18n');
      var v = dict[k];
      if (v === undefined) v = fallback[k];
      if (v !== undefined) el.innerHTML = v;
    });
  }

  function setLang(l) {
    lang = l;
    applyUi();
    applyPlanLang();
    try { sessionStorage.setItem('andalusien-lang', l); } catch (e) {}
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sh-lang'), function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang); });
  });

  function wireTabs() {
    var btns = planEl.querySelectorAll('.tab-btn');
    var panes = planEl.querySelectorAll('.tab-content');
    Array.prototype.forEach.call(btns, function (b) {
      var m = /switchTab\('([^']+)'\)/.exec(b.getAttribute('onclick') || '');
      var target = m ? m[1] : null;
      b.removeAttribute('onclick');
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(panes, function (p) { p.classList.remove('active'); });
        Array.prototype.forEach.call(btns, function (x) { x.classList.remove('active'); });
        var pane = target && planEl.querySelector('#' + target);
        if (pane) pane.classList.add('active');
        b.classList.add('active');
      });
    });
  }

  function render(payload) {
    data = payload;
    var st = document.createElement('style');
    st.textContent = payload.css;
    document.head.appendChild(st);
    planEl.innerHTML = payload.html;
    wireTabs();
    gate.hidden = true;
    topbar.hidden = false;
    applyPlanLang();
  }

  async function unlock(password) {
    var enc = new TextEncoder();
    var salt = b64ToBytes(BUNDLE.kdf.salt);
    var iv = b64ToBytes(BUNDLE.iv);
    var ct = b64ToBytes(BUNDLE.ct);
    var base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: BUNDLE.kdf.iter, hash: BUNDLE.kdf.hash },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  document.getElementById('gate-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!window.crypto || !crypto.subtle) { msg.className = 'sh-msg'; msg.textContent = UI[lang].nocrypto; return; }
    btn.disabled = true;
    msg.className = 'sh-msg sh-busy';
    msg.textContent = UI[lang].busy;
    try {
      var payload = await unlock(pw.value);
      try { sessionStorage.setItem('andalusien-pw', pw.value); } catch (e) {}
      render(payload);
    } catch (e) {
      msg.className = 'sh-msg';
      msg.textContent = UI[lang].bad;
      pw.select();
    } finally {
      btn.disabled = false;
    }
  });

  (function init() {
    var saved = null, savedPw = null;
    try { saved = sessionStorage.getItem('andalusien-lang'); } catch (e) {}
    try { savedPw = sessionStorage.getItem('andalusien-pw'); } catch (e) {}
    if (saved && UI[saved]) lang = saved;
    applyUi();
    pw.focus();
    if (savedPw) {
      unlock(savedPw).then(render).catch(function () {
        try { sessionStorage.removeItem('andalusien-pw'); } catch (e) {}
      });
    }
  })();
})();
</script>
</body>
</html>
