<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reisen</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header {
    text-align: center;
    color: white;
    padding: 2.5rem 1rem 3rem;
  }
  header img {
    width: 110px; height: 110px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    margin-bottom: 1.25rem;
  }
  header h1 { font-size: 2.4rem; margin-bottom: 0.5rem; letter-spacing: -0.01em; }
  header p { font-size: 1.05rem; opacity: 0.9; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.25rem;
  }
  .trip {
    display: block;
    background: white;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22);
    padding: 1.75rem;
    text-decoration: none;
    color: inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .trip:hover { transform: translateY(-3px); box-shadow: 0 18px 50px rgba(0,0,0,0.3); }
  .trip-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; margin-bottom: 0.85rem;
  }
  .trip-title { font-size: 1.3rem; font-weight: 600; color: #333; }
  .lock { font-size: 0.8rem; color: #856404; background: #fff3cd; border-radius: 20px; padding: 0.3rem 0.7rem; white-space: nowrap; }
  .trip-dates { color: #667eea; font-weight: 600; margin-bottom: 0.5rem; }
  .trip-route { color: #666; font-size: 0.95rem; line-height: 1.5; }
  .trip-langs { margin-top: 1rem; font-size: 0.85rem; color: #999; }
  .soon {
    border: 2px dashed rgba(255,255,255,0.4);
    border-radius: 12px;
    padding: 1.75rem;
    color: rgba(255,255,255,0.75);
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 0.95rem; min-height: 180px;
  }
  footer { text-align: center; color: rgba(255,255,255,0.65); font-size: 0.85rem; margin-top: 3rem; }
  @media (max-width: 600px) {
    header h1 { font-size: 1.8rem; }
  }
</style>
</head>
